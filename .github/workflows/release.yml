name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Run tests
      run: go test -v ./...

    - name: Build binaries
      run: |
        # Extract version from tag (remove 'v' prefix)
        VERSION=${GITHUB_REF_NAME#v}
        COMMIT_HASH=$(git rev-parse --short HEAD)
        BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        LDFLAGS="-X main.version=${VERSION} -X main.commitHash=${COMMIT_HASH} -X main.buildDate=${BUILD_DATE}"
        
        echo "Building version: ${VERSION}"
        echo "Commit: ${COMMIT_HASH}"
        echo "Build date: ${BUILD_DATE}"
        
        # Linux AMD64
        GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o liquibase-linter-linux-amd64 ./cmd/liquibase-linter
        
        # Linux ARM64
        GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o liquibase-linter-linux-arm64 ./cmd/liquibase-linter
        
        # macOS AMD64
        GOOS=darwin GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o liquibase-linter-darwin-amd64 ./cmd/liquibase-linter
        
        # macOS ARM64 (Apple Silicon)
        GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o liquibase-linter-darwin-arm64 ./cmd/liquibase-linter
        
        # Windows AMD64
        GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o liquibase-linter-windows-amd64.exe ./cmd/liquibase-linter
        
        # Create checksums
        sha256sum liquibase-linter-* > checksums.txt

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          liquibase-linter-*
          checksums.txt
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        COMMIT_HASH=$(git rev-parse --short HEAD)
        BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        
        docker buildx build \
          --build-arg VERSION=${VERSION} \
          --build-arg COMMIT_HASH=${COMMIT_HASH} \
          --build-arg BUILD_DATE=${BUILD_DATE} \
          --platform linux/amd64,linux/arm64 \
          --push \
          --tag ghcr.io/${{ github.repository }}:${VERSION} \
          --tag ghcr.io/${{ github.repository }}:latest \
          --cache-from type=gha \
          --cache-to type=gha,mode=max \
          .
